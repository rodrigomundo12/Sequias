name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:

  drought-monitoring:

    runs-on: self-hosted

    steps:

      # ============================================================
      # 0. SYNCHRONIZE LOCAL SELF-HOSTED RUNNER
      # ============================================================

      - name: Synchronize local repository
        shell: cmd
        run: |

          echo ==============================================
          echo SYNCHRONIZING LOCAL REPOSITORY
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Fetching origin/main...

          git fetch origin main

          if errorlevel 1 (
              echo ERROR: git fetch failed.
              exit /b 1
          )

          echo.
          echo Resetting local repository to origin/main...

          git reset --hard origin/main

          if errorlevel 1 (
              echo ERROR: git reset failed.
              exit /b 1
          )

          echo.
          echo Current commit:

          git rev-parse --short HEAD

          echo.
          echo Repository synchronized successfully.


      # ============================================================
      # 1. RUN DROUGHT MONITORING
      # ============================================================

      - name: Run Sequias drought monitoring
        shell: cmd
        run: |

          echo ==============================================
          echo STARTING SEQUIAS DROUGHT MONITORING
          echo ==============================================

          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "SCRIPT=%PROJECT_ROOT%\scripts\run_drought_monitoring.py"

          echo.
          echo Python:
          "%PYTHON_EXE%" --version

          echo.
          echo Project:
          echo %PROJECT_ROOT%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%SCRIPT%" (
              echo.
              echo ERROR: run_drought_monitoring.py was not found.
              exit /b 1
          )

          echo.
          echo Running script...

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo DROUGHT MONITORING FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo DROUGHT MONITORING FINISHED SUCCESSFULLY
          echo ==============================================


      
      # ============================================================
      # 2. PREPARE GITHUB PAGES FILES
      # ============================================================

      - name: Prepare GitHub Pages
        shell: cmd
        run: |

          echo ==============================================
          echo PREPARING GITHUB PAGES
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Cleaning previous web vectors...

          if exist "docs\vectors" (
              rmdir /s /q "docs\vectors"
          )

          mkdir "docs\vectors"

          echo.
          echo ==============================================
          echo CHECKING WEB PRODUCTS
          echo ==============================================

          if not exist "distribution\latest\vectors\NDDI.geojson" (
              echo ERROR: NDDI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\MNDWI.geojson" (
              echo ERROR: MNDWI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NMDI.geojson" (
              echo ERROR: NMDI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NDII.geojson" (
              echo ERROR: NDII.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NDVI.geojson" (
              echo ERROR: NDVI.geojson not found.
              exit /b 1
          )

          echo.
          echo All five web products found.


          # ========================================================
          # COPY WEB PRODUCTS
          # ========================================================

          echo.
          echo ==============================================
          echo COPYING WEB VECTOR PRODUCTS
          echo ==============================================

          copy /Y "distribution\latest\vectors\NDDI.geojson" "docs\vectors\NDDI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDDI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\MNDWI.geojson" "docs\vectors\MNDWI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy MNDWI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NMDI.geojson" "docs\vectors\NMDI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NMDI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NDII.geojson" "docs\vectors\NDII.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDII.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NDVI.geojson" "docs\vectors\NDVI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDVI.geojson
              exit /b 1
          )

          echo.
          echo Web vector products copied successfully.


          # ========================================================
          # CREATE INTERACTIVE MAP
          # ========================================================

          echo.
          echo ==============================================
          echo CREATING INTERACTIVE LEAFLET MAP
          echo ==============================================

          "%PYTHON_EXE%" -c "from pathlib import Path; html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>El Salvador Drought Monitoring Map</title>

          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

          <style>
          html, body {
              height: 100%%;
              margin: 0;
              padding: 0;
              font-family: Arial, sans-serif;
          }

          #map {
              width: 100%%;
              height: 100vh;
          }

          .title-box,
          .legend,
          .info-box {
              background: white;
              padding: 10px 14px;
              border-radius: 6px;
              box-shadow: 0 1px 5px rgba(0,0,0,0.3);
          }

          .title-box h1 {
              margin: 0;
              font-size: 18px;
          }

          .title-box p {
              margin: 5px 0 0;
              font-size: 12px;
          }

          .legend {
              line-height: 20px;
          }

          .legend h4 {
              margin: 0 0 6px;
          }

          .legend-item {
              display: flex;
              align-items: center;
          }

          .legend-color {
              width: 18px;
              height: 18px;
              margin-right: 7px;
              border: 1px solid #777;
          }

          .info-box {
              min-width: 170px;
          }

          .leaflet-control-layers {
              font-size: 14px;
          }

          .leaflet-control-layers-expanded {
              padding: 8px 12px;
          }
          </style>
          </head>

          <body>

          <div id="map"></div>

          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

          <script>

          console.log("Drought monitoring map starting...");

          const map = L.map("map", {
              center: [13.7942, -88.8965],
              zoom: 8
          });

          const osm = L.tileLayer(
              "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
              {
                  maxZoom: 19,
                  attribution: "&copy; OpenStreetMap contributors"
              }
          ).addTo(map);


          // =========================================================
          // CLASSIFICATION
          // =========================================================

          const classColors = {
              1: "#8B0000",
              2: "#FF8C00",
              3: "#FFFF66",
              4: "#90EE90",
              5: "#006400"
          };

          const classNames = {
              1: "Very Low",
              2: "Low",
              3: "Normal",
              4: "High",
              5: "Very High"
          };


          // =========================================================
          // LAYER STORAGE
          // =========================================================

          const overlayLayers = {};

          const files = [
              "NDDI",
              "MNDWI",
              "NMDI",
              "NDII",
              "NDVI"
          ];


          // =========================================================
          // STYLE
          // =========================================================

          function styleFeature(feature) {

              const id = feature.properties?.class_id;

              return {
                  color: "#444",
                  weight: 0.4,
                  opacity: 0.8,
                  fillColor: classColors[id] || "#999",
                  fillOpacity: 0.65
              };
          }


          // =========================================================
          // POPUP
          // =========================================================

          function onEachFeature(feature, layer) {

              const p = feature.properties || {};

              const cls =
                  p.class_name ||
                  classNames[p.class_id] ||
                  "Unknown";

              const area =
                  p.area_m2 != null
                      ? Number(p.area_m2).toLocaleString(
                            undefined,
                            {maximumFractionDigits: 0}
                        ) + " m²"
                      : "N/A";

              const min =
                  p.min_value != null
                      ? Number(p.min_value).toFixed(4)
                      : "N/A";

              const max =
                  p.max_value != null
                      ? Number(p.max_value).toFixed(4)
                      : "N/A";

              layer.bindPopup(
                  "<strong>El Salvador Drought Monitoring</strong>" +
                  "<br><br>" +
                  "<b>Index:</b> " + (p.index || "N/A") +
                  "<br>" +
                  "<b>Class:</b> " + cls +
                  "<br>" +
                  "<b>Area:</b> " + area +
                  "<br>" +
                  "<b>Minimum:</b> " + min +
                  "<br>" +
                  "<b>Maximum:</b> " + max
              );
          }


          // =========================================================
          // LOAD ALL FIVE GEOJSON FILES
          // =========================================================

          async function loadAllLayers() {

              const status =
                  document.getElementById("status");

              status.textContent =
                  "Loading drought products...";

              console.log(
                  "Loading:",
                  files
              );

              try {

                  const promises = files.map(async function(name) {

                      console.log(
                          "Requesting " + name + ".geojson"
                      );

                      const response =
                          await fetch(name + ".geojson");

                      if (!response.ok) {

                          throw new Error(
                              name +
                              ".geojson returned HTTP " +
                              response.status
                          );
                      }

                      const data =
                          await response.json();

                      console.log(
                          name +
                          " GeoJSON loaded successfully."
                      );

                      const layer =
                          L.geoJSON(
                              data,
                              {
                                  style: styleFeature,
                                  onEachFeature: onEachFeature
                              }
                          );

                      overlayLayers[name] = layer;

                      return layer;
                  });


                  // Wait until ALL five GeoJSON files are ready.

                  await Promise.all(promises);


                  console.log(
                      "ALL FIVE LAYERS READY:"
                  );

                  console.log(
                      Object.keys(overlayLayers)
                  );


                  // ==================================================
                  // CREATE LAYER CONTROL
                  // ==================================================

                  const baseMaps = {
                      "OpenStreetMap": osm
                  };

                  const layerControl =
                      L.control.layers(
                          baseMaps,
                          null,
                          {
                              collapsed: false,
                              position: "topright"
                          }
                      ).addTo(map);


                  // ==================================================
                  // ADD FIVE INDEXES TO THE CONTROL
                  // ==================================================

                  layerControl.addOverlay(
                      overlayLayers["NDDI"],
                      "NDDI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["MNDWI"],
                      "MNDWI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NMDI"],
                      "NMDI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NDII"],
                      "NDII"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NDVI"],
                      "NDVI"
                  );


                  // ==================================================
                  // DEFAULT INDEX
                  // ==================================================

                  overlayLayers["NDDI"].addTo(map);


                  // ==================================================
                  // FIT MAP
                  // ==================================================

                  const bounds =
                      overlayLayers["NDDI"].getBounds();

                  if (bounds.isValid()) {

                      map.fitBounds(
                          bounds,
                          {
                              padding: [20, 20]
                          }
                      );
                  }


                  status.textContent =
                      "5 / 5 drought products loaded";


                  console.log(
                      "Layer selector created successfully."
                  );

                  console.log(
                      "Available indexes: NDDI, MNDWI, NMDI, NDII, NDVI"
                  );

              }

              catch (error) {

                  console.error(
                      "ERROR LOADING DROUGHT PRODUCTS:",
                      error
                  );

                  status.textContent =
                      "ERROR: " + error.message;
              }
          }


          // =========================================================
          // TITLE
          // =========================================================

          const title =
              L.control({
                  position: "topleft"
              });

          title.onAdd = function() {

              const d =
                  L.DomUtil.create(
                      "div",
                      "title-box"
                  );

              d.innerHTML =
                  "<h1>El Salvador Drought Monitoring</h1>" +
                  "<p>Sentinel-2 L2A drought indices</p>";

              return d;
          };

          title.addTo(map);


          // =========================================================
          // LEGEND
          // =========================================================

          const legend =
              L.control({
                  position: "bottomright"
              });

          legend.onAdd = function() {

              const d =
                  L.DomUtil.create(
                      "div",
                      "legend"
                  );

              d.innerHTML =
                  "<h4>Drought Classification</h4>";

              for (
                  let i = 1;
                  i <= 5;
                  i++
              ) {

                  d.innerHTML +=
                      "<div class='legend-item'>" +
                      "<div class='legend-color' " +
                      "style='background:" +
                      classColors[i] +
                      "'></div>" +
                      classNames[i] +
                      "</div>";
              }

              return d;
          };

          legend.addTo(map);


          // =========================================================
          // STATUS
          // =========================================================

          const info =
              L.control({
                  position: "bottomleft"
              });

          info.onAdd = function() {

              const d =
                  L.DomUtil.create(
                      "div",
                      "info-box"
                  );

              d.id = "status";

              d.textContent =
                  "Loading drought products...";

              return d;
          };

          info.addTo(map);


          // =========================================================
          // START
          // =========================================================

          loadAllLayers();

          </script>

          </body>
          </html>
          '''; Path(r'docs\vectors\index.html').write_text(html, encoding='utf-8')"

          if errorlevel 1 (
              echo.
              echo ERROR: Could not create interactive map.
              exit /b 1
          )

          if not exist "docs\vectors\index.html" (
              echo.
              echo ERROR: docs\vectors\index.html was not created.
              exit /b 1
          )

          echo.
          echo Interactive Leaflet map created successfully.


          # ========================================================
          # VERIFY WEB FILES
          # ========================================================

          echo.
          echo ==============================================
          echo VERIFYING WEB FILES
          echo ==============================================

          dir "docs\vectors"

          echo.
          echo Checking interactive map file...

          "%PYTHON_EXE%" -c "from pathlib import Path; p=Path(r'docs\vectors\index.html'); t=p.read_text(encoding='utf-8'); print('Map HTML size:',p.stat().st_size,'bytes'); print('Leaflet detected:', 'leaflet@1.9.4' in t); print('NDDI detected:', 'NDDI.geojson' in t); print('MNDWI detected:', 'MNDWI.geojson' in t); print('NMDI detected:', 'NMDI.geojson' in t); print('NDII detected:', 'NDII.geojson' in t); print('NDVI detected:', 'NDVI.geojson' in t); print('Promise.all detected:', 'Promise.all' in t); print('addOverlay detected:', 'addOverlay' in t); print('Layer control detected:', 'L.control.layers' in t)"

          if errorlevel 1 (
              echo.
              echo ERROR: Map verification failed.
              exit /b 1
          )


          # ========================================================
          # COPY METADATA
          # ========================================================

          echo.
          echo ==============================================
          echo COPYING METADATA
          echo ==============================================

          if exist "docs\metadata" (
              rmdir /s /q "docs\metadata"
          )

          mkdir "docs\metadata"

          if exist "metadata\*" (
              xcopy "metadata\*" "docs\metadata\" /E /I /Y
          ) else (
              echo WARNING: No metadata directory found.
          )

          echo.
          echo ==============================================
          echo GITHUB PAGES FILES PREPARED
          echo ==============================================



      # ============================================================
      # 3. CREATE GITHUB PAGES LANDING PAGE
      # ============================================================

      - name: Create GitHub Pages index
        shell: cmd
        run: |

          echo ==============================================
          echo CREATING GITHUB PAGES INDEX
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          (
            echo ^<!DOCTYPE html^>
            echo ^<html lang="en"^>
            echo ^<head^>
            echo ^<meta charset="UTF-8"^>
            echo ^<meta name="viewport" content="width=device-width, initial-scale=1.0"^>
            echo ^<title^>El Salvador Drought Monitoring^</title^>
            echo ^<style^>
            echo body { font-family: Arial, sans-serif; margin: 40px; }
            echo h1 { margin-bottom: 10px; }
            echo .box { padding: 20px; border: 1px solid #ccc; border-radius: 8px; max-width: 800px; }
            echo a { text-decoration: none; }
            echo .map-button { display: inline-block; margin-top: 10px; padding: 12px 18px; background: #333; color: white; border-radius: 6px; }
            echo ^</style^>
            echo ^</head^>
            echo ^<body^>
            echo ^<h1^>El Salvador Drought Monitoring^</h1^>
            echo ^<div class="box"^>
            echo ^<p^>Automated drought-monitoring products derived from Sentinel-2 L2A.^</p^>
            echo ^<p^>Latest products are automatically updated by the local processing system.^</p^>
            echo ^<h2^>Interactive Map^</h2^>
            echo ^<p^>Explore the latest drought-monitoring products interactively.^</p^>
            echo ^<a class="map-button" href="vectors/"^>Open Interactive Map^</a^>
            echo ^</div^>
            echo ^</body^>
            echo ^</html^>
          ) > "docs\index.html"

          if errorlevel 1 (
              echo.
              echo ERROR: Could not create GitHub Pages landing page.
              exit /b 1
          )

          echo.
          echo GitHub Pages landing page created.


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push web products
        shell: cmd
        run: |

          echo ==============================================
          echo COMMITTING WEB PRODUCTS
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Git repository:

          git rev-parse --show-toplevel

          echo.
          echo Git status:

          git status

          echo.
          echo Adding docs...

          git add docs

          echo.
          echo Checking staged changes...

          git diff --cached --quiet

          if not errorlevel 1 (

              echo.
              echo No changes detected.
              echo Nothing to commit.
              exit /b 0

          )

          echo.
          echo Creating commit...

          git commit -m "Add interactive drought monitoring map"

          if errorlevel 1 (
              echo.
              echo ERROR: Git commit failed.
              exit /b 1
          )

          echo.
          echo Pushing to GitHub...

          git push origin main

          if errorlevel 1 (
              echo.
              echo ERROR: Git push failed.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo WEB PRODUCTS PUBLISHED SUCCESSFULLY
          echo ==============================================

          echo.
          echo GitHub Pages:
          echo https://rodrigomundo12.github.io/Sequias/

