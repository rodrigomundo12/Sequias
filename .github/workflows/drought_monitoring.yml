name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:
  drought-monitoring:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 0. SYNCHRONIZE LOCAL SELF-HOSTED RUNNER
      # ============================================================

      - name: Synchronize local repository
        shell: cmd
        run: |
          echo ==============================================
          echo SYNCHRONIZING LOCAL REPOSITORY
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Fetching origin/main...

          git fetch origin main

          if errorlevel 1 (
              echo ERROR: git fetch failed.
              exit /b 1
          )

          echo.
          echo Resetting local repository to origin/main...

          git reset --hard origin/main

          if errorlevel 1 (
              echo ERROR: git reset failed.
              exit /b 1
          )

          echo.
          echo Current commit:

          git rev-parse --short HEAD

          echo.
          echo Repository synchronized successfully.


      # ============================================================
      # 1. RUN DROUGHT MONITORING
      # ============================================================

      - name: Run Sequias drought monitoring
        shell: cmd
        run: |
          echo ==============================================
          echo STARTING SEQUIAS DROUGHT MONITORING
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "SCRIPT=%PROJECT_ROOT%\scripts\run_drought_monitoring.py"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Python executable:
          echo %PYTHON_EXE%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%PYTHON_EXE%" (
              echo ERROR: Python executable not found.
              exit /b 1
          )

          if not exist "%SCRIPT%" (
              echo ERROR: Drought monitoring script not found.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo RUNNING DROUGHT MONITORING SCRIPT
          echo ==============================================

          cd /d "%PROJECT_ROOT%"

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo DROUGHT MONITORING FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo DROUGHT MONITORING COMPLETED SUCCESSFULLY
          echo ==============================================


      # ============================================================
      # 2. PREPARE GITHUB PAGES
      # ============================================================

      - name: Prepare GitHub Pages
        shell: cmd
        run: |
          echo ==============================================
          echo PREPARING GITHUB PAGES
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "SCRIPT=%PROJECT_ROOT%\scripts\prepare_github_pages.py"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Python executable:
          echo %PYTHON_EXE%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%PYTHON_EXE%" (
              echo ERROR: Python executable not found.
              exit /b 1
          )

          if not exist "%SCRIPT%" (
              echo ERROR: GitHub Pages preparation script not found.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo RUNNING GITHUB PAGES PREPARATION
          echo ==============================================

          cd /d "%PROJECT_ROOT%"

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo GITHUB PAGES PREPARATION FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo GITHUB PAGES PREPARATION COMPLETED
          echo ==============================================


      # ============================================================
      # 3. CREATE GITHUB PAGES LANDING PAGE
      # ============================================================

      - name: Create GitHub Pages index
        shell: cmd
        run: |
          echo ==============================================
          echo CREATING GITHUB PAGES INDEX
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "SCRIPT=%PROJECT_ROOT%\scripts\create_pages_index.py"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Python executable:
          echo %PYTHON_EXE%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%PYTHON_EXE%" (
              echo ERROR: Python executable not found.
              exit /b 1
          )

          if not exist "%SCRIPT%" (
              echo ERROR: GitHub Pages index script not found.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo RUNNING GITHUB PAGES INDEX CREATION
          echo ==============================================

          cd /d "%PROJECT_ROOT%"

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo GITHUB PAGES INDEX CREATION FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo GITHUB PAGES INDEX CREATED SUCCESSFULLY
          echo ==============================================


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push web products
        shell: cmd
        run: |
          echo ==============================================
          echo COMMITTING WEB PRODUCTS
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Git repository:

          git rev-parse --show-toplevel

          if errorlevel 1 (
              echo ERROR: This is not a Git repository.
              exit /b 1
          )

          echo.
          echo Git status:

          git status

          echo.
          echo ==============================================
          echo ADDING DOCS
          echo ==============================================

          git add docs

          if errorlevel 1 (
              echo ERROR: git add failed.
              exit /b 1
          )

          echo.
          echo Checking staged changes...

          git diff --cached --quiet

          if not errorlevel 1 (
              echo.
              echo No changes detected.
              echo Nothing to commit.
              exit /b 0
          )

          echo.
          echo ==============================================
          echo CREATING COMMIT
          echo ==============================================

          git commit -m "Update drought monitoring products"

          if errorlevel 1 (
              echo.
              echo ERROR: Git commit failed.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo PUSHING TO GITHUB
          echo ==============================================

          git push origin main

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo GIT PUSH FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo WEB PRODUCTS PUBLISHED SUCCESSFULLY
          echo ==============================================

          echo.
          echo GitHub Pages:
          echo https://rodrigomundo12.github.io/Sequias/
