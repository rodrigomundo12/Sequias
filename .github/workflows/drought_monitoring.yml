name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:

  run-drought-monitoring:

    runs-on: self-hosted

    steps:

      - name: Run drought monitoring script
        shell: cmd
        run: |

          echo ==============================================
          echo STARTING SEQUIAS DROUGHT MONITORING
          echo ==============================================

          set PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe

          set PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos

          echo.
          echo Python:
          "%PYTHON_EXE%" --version

          echo.
          echo Project:
          "%PROJECT_ROOT%"

          echo.
          echo Running script...

          "%PYTHON_EXE%" "%PROJECT_ROOT%\scripts\run_drought_monitoring.py"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo DROUGHT MONITORING FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo DROUGHT MONITORING FINISHED
          echo ==============================================