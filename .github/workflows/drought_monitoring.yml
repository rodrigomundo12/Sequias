name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:

  drought-monitoring:

    runs-on: self-hosted

    steps:

      # ============================================================
      # 0. SYNCHRONIZE LOCAL SELF-HOSTED RUNNER
      # ============================================================

      - name: Synchronize local repository
        shell: cmd
        run: |

          echo ==============================================
          echo SYNCHRONIZING LOCAL REPOSITORY
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Fetching origin/main...

          git fetch origin main

          if errorlevel 1 (
              echo ERROR: git fetch failed.
              exit /b 1
          )

          echo.
          echo Resetting local repository to origin/main...

          git reset --hard origin/main

          if errorlevel 1 (
              echo ERROR: git reset failed.
              exit /b 1
          )

          echo.
          echo Current commit:

          git rev-parse --short HEAD

          echo.
          echo Repository synchronized successfully.


      # ============================================================
      # 1. RUN DROUGHT MONITORING
      # ============================================================

      - name: Run Sequias drought monitoring
        shell: cmd
        run: |

          echo ==============================================
          echo STARTING SEQUIAS DROUGHT MONITORING
          echo ==============================================

          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "SCRIPT=%PROJECT_ROOT%\scripts\run_drought_monitoring.py"

          echo.
          echo Python:
          "%PYTHON_EXE%" --version

          echo.
          echo Project:
          echo %PROJECT_ROOT%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%SCRIPT%" (
              echo.
              echo ERROR: run_drought_monitoring.py was not found.
              exit /b 1
          )

          echo.
          echo Running script...

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo DROUGHT MONITORING FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo DROUGHT MONITORING FINISHED SUCCESSFULLY
          echo ==============================================


      # ============================================================
      # 2. PREPARE GITHUB PAGES FILES
      # ============================================================

      - name: Prepare GitHub Pages
        shell: cmd
        run: |

          echo ==============================================
          echo PREPARING GITHUB PAGES
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Cleaning previous web vectors...

          if exist "docs\vectors" (
              rmdir /s /q "docs\vectors"
          )

          mkdir "docs\vectors"

          echo.
          echo ==============================================
          echo CHECKING WEB PRODUCTS
          echo ==============================================

          if not exist "distribution\latest\vectors\NDDI.geojson" (
              echo ERROR: NDDI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\MNDWI.geojson" (
              echo ERROR: MNDWI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NMDI.geojson" (
              echo ERROR: NMDI.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NDII.geojson" (
              echo ERROR: NDII.geojson not found.
              exit /b 1
          )

          if not exist "distribution\latest\vectors\NDVI.geojson" (
              echo ERROR: NDVI.geojson not found.
              exit /b 1
          )

          echo.
          echo All five web products found.

          echo.
          echo ==============================================
          echo COPYING WEB VECTOR PRODUCTS
          echo ==============================================

          copy /Y "distribution\latest\vectors\NDDI.geojson" "docs\vectors\NDDI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDDI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\MNDWI.geojson" "docs\vectors\MNDWI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy MNDWI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NMDI.geojson" "docs\vectors\NMDI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NMDI.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NDII.geojson" "docs\vectors\NDII.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDII.geojson
              exit /b 1
          )

          copy /Y "distribution\latest\vectors\NDVI.geojson" "docs\vectors\NDVI.geojson"

          if errorlevel 1 (
              echo ERROR: Could not copy NDVI.geojson
              exit /b 1
          )

          echo.
          echo Web vector products copied successfully.


          # ========================================================
          # CREATE INTERACTIVE LEAFLET MAP
          # ========================================================

          echo.
          echo ==============================================
          echo CREATING INTERACTIVE LEAFLET MAP
          echo ==============================================

          "%PYTHON_EXE%" -c "from pathlib import Path; p=Path(r'docs\vectors\index.html'); p.write_text('''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>El Salvador Drought Monitoring Map</title>

          <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          />

          <style>

          html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
          }

          #map {
            width: 100%;
            height: 100vh;
          }

          .title-box {
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
          }

          .title-box h1 {
            margin: 0;
            font-size: 18px;
          }

          .title-box p {
            margin: 5px 0 0 0;
            font-size: 12px;
          }

          .legend {
            background: white;
            padding: 10px 12px;
            line-height: 20px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
          }

          .legend h4 {
            margin: 0 0 6px 0;
          }

          .legend-item {
            display: flex;
            align-items: center;
          }

          .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 7px;
            border: 1px solid #777;
          }

          .info-box {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            min-width: 180px;
          }

          </style>

          </head>

          <body>

          <div id="map"></div>

          <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
          </script>

          <script>

          // ========================================================
          // MAP INITIALIZATION
          // ========================================================

          const map = L.map("map", {
            center: [13.7942, -88.8965],
            zoom: 8
          });


          // ========================================================
          // BASE MAP
          // ========================================================

          const osm = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
              maxZoom: 19,
              attribution: "&copy; OpenStreetMap contributors"
            }
          ).addTo(map);


          // ========================================================
          // CLASS COLORS
          // ========================================================

          const classColors = {
            1: "#8B0000",
            2: "#FF8C00",
            3: "#FFFF66",
            4: "#90EE90",
            5: "#006400"
          };


          const classNames = {
            1: "Very Low",
            2: "Low",
            3: "Normal",
            4: "High",
            5: "Very High"
          };


          // ========================================================
          // STYLE FUNCTION
          // ========================================================

          function polygonStyle(feature) {

            const classId =
              feature.properties &&
              feature.properties.class_id;

            return {
              color: "#444",
              weight: 0.4,
              opacity: 0.8,
              fillColor: classColors[classId] || "#999999",
              fillOpacity: 0.65
            };
          }


          // ========================================================
          // POPUP
          // ========================================================

          function onEachFeature(feature, layer) {

            const p = feature.properties || {};

            const className =
              p.class_name ||
              classNames[p.class_id] ||
              "Unknown";

            const area =
              p.area_m2 !== undefined &&
              p.area_m2 !== null
                ? Number(p.area_m2).toLocaleString(
                    undefined,
                    {
                      maximumFractionDigits: 0
                    }
                  )
                : "N/A";

            const index =
              p.index || "N/A";

            const minValue =
              p.min_value !== null &&
              p.min_value !== undefined
                ? Number(p.min_value).toFixed(4)
                : "N/A";

            const maxValue =
              p.max_value !== null &&
              p.max_value !== undefined
                ? Number(p.max_value).toFixed(4)
                : "N/A";

            layer.bindPopup(
              "<strong>Drought Monitoring</strong><br><br>" +
              "<b>Index:</b> " + index + "<br>" +
              "<b>Class:</b> " + className + "<br>" +
              "<b>Class ID:</b> " + (p.class_id || "N/A") + "<br>" +
              "<b>Area:</b> " + area + " m²<br>" +
              "<b>Minimum:</b> " + minValue + "<br>" +
              "<b>Maximum:</b> " + maxValue
            );
          }


          // ========================================================
          // LOAD GEOJSON LAYER
          // ========================================================

          async function loadGeoJSON(
            filename,
            layerName
          ) {

            try {

              const response =
                await fetch(filename);

              if (!response.ok) {
                throw new Error(
                  "HTTP " + response.status
                );
              }

              const data =
                await response.json();

              const layer =
                L.geoJSON(
                  data,
                  {
                    style: polygonStyle,
                    onEachFeature: onEachFeature
                  }
                );

              overlayLayers[layerName] = layer;

              layer.addTo(map);

              loadedLayers++;

              if (loadedLayers === totalLayers) {
                fitToAllLayers();
              }

              updateInfo();

            } catch (error) {

              console.error(
                "Error loading " +
                filename +
                ":",
                error
              );

              const errorBox =
                document.getElementById(
                  "map-status"
                );

              errorBox.innerHTML +=
                "<br>Could not load " +
                filename;

            }
          }


          // ========================================================
          // LAYER COLLECTION
          // ========================================================

          const overlayLayers = {};

          const totalLayers = 5;

          let loadedLayers = 0;


          // ========================================================
          // LOAD ALL FIVE INDICES
          // ========================================================

          loadGeoJSON(
            "NDDI.geojson",
            "NDDI"
          );

          loadGeoJSON(
            "MNDWI.geojson",
            "MNDWI"
          );

          loadGeoJSON(
            "NMDI.geojson",
            "NMDI"
          );

          loadGeoJSON(
            "NDII.geojson",
            "NDII"
          );

          loadGeoJSON(
            "NDVI.geojson",
            "NDVI"
          );


          // ========================================================
          // LAYER CONTROL
          // ========================================================

          const baseLayers = {
            "OpenStreetMap": osm
          };

          L.control.layers(
            baseLayers,
            overlayLayers,
            {
              collapsed: false
            }
          ).addTo(map);


          // ========================================================
          // FIT MAP TO DATA
          // ========================================================

          function fitToAllLayers() {

            let bounds = null;

            Object.values(
              overlayLayers
            ).forEach(function(layer) {

              if (
                layer &&
                layer.getBounds &&
                layer.getBounds().isValid()
              ) {

                if (bounds === null) {
                  bounds =
                    layer.getBounds();
                } else {
                  bounds.extend(
                    layer.getBounds()
                  );
                }
              }
            });

            if (
              bounds !== null &&
              bounds.isValid()
            ) {

              map.fitBounds(
                bounds,
                {
                  padding: [20, 20]
                }
              );
            }
          }


          // ========================================================
          // TITLE
          // ========================================================

          const titleControl =
            L.control({
              position: "topleft"
            });

          titleControl.onAdd =
            function() {

              const div =
                L.DomUtil.create(
                  "div",
                  "title-box"
                );

              div.innerHTML =
                "<h1>El Salvador Drought Monitoring</h1>" +
                "<p>Sentinel-2 L2A drought indices</p>";

              return div;
            };

          titleControl.addTo(map);


          // ========================================================
          // LEGEND
          // ========================================================

          const legend =
            L.control({
              position: "bottomright"
            });

          legend.onAdd =
            function() {

              const div =
                L.DomUtil.create(
                  "div",
                  "legend"
                );

              div.innerHTML =
                "<h4>Drought Classification</h4>";

              for (
                let i = 1;
                i <= 5;
                i++
              ) {

                div.innerHTML +=
                  "<div class='legend-item'>" +
                  "<div class='legend-color' " +
                  "style='background:" +
                  classColors[i] +
                  "'></div>" +
                  classNames[i] +
                  "</div>";
              }

              return div;
            };

          legend.addTo(map);


          // ========================================================
          // STATUS / INFO
          // ========================================================

          const info =
            L.control({
              position: "bottomleft"
            });

          info.onAdd =
            function() {

              const div =
                L.DomUtil.create(
                  "div",
                  "info-box"
                );

              div.id = "map-status";

              div.innerHTML =
                "Loading drought products...";

              return div;
            };

          info.addTo(map);


          function updateInfo() {

            const box =
              document.getElementById(
                "map-status"
              );

            if (!box) {
              return;
            }

            box.innerHTML =
              "Products loaded: " +
              loadedLayers +
              " / " +
              totalLayers;
          }

          </script>

          </body>
          </html>
          ''', encoding='utf-8')"

          if errorlevel 1 (
              echo.
              echo ERROR: Could not create interactive map.
              exit /b 1
          )

          echo.
          echo Interactive map created successfully.


          # ========================================================
          # SHOW WEB FILES
          # ========================================================

          echo.
          echo ==============================================
          echo WEB VECTOR FILES
          echo ==============================================

          dir "docs\vectors"

          echo.
          echo ==============================================
          echo COPYING METADATA
          echo ==============================================

          if exist "docs\metadata" (
              rmdir /s /q "docs\metadata"
          )

          mkdir "docs\metadata"

          if exist "metadata\*" (
              xcopy "metadata\*" "docs\metadata\" /E /I /Y
          ) else (
              echo WARNING: No metadata directory found.
          )

          echo.
          echo ==============================================
          echo GITHUB PAGES FILES PREPARED
          echo ==============================================


      # ============================================================
      # 3. CREATE GITHUB PAGES LANDING PAGE
      # ============================================================

      - name: Create GitHub Pages index
        shell: cmd
        run: |

          echo ==============================================
          echo CREATING GITHUB PAGES INDEX
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          (
            echo ^<!DOCTYPE html^>
            echo ^<html lang="en"^>
            echo ^<head^>
            echo ^<meta charset="UTF-8"^>
            echo ^<meta name="viewport" content="width=device-width, initial-scale=1.0"^>
            echo ^<title^>El Salvador Drought Monitoring^</title^>
            echo ^<style^>
            echo body { font-family: Arial, sans-serif; margin: 40px; }
            echo h1 { margin-bottom: 10px; }
            echo .box { padding: 20px; border: 1px solid #ccc; border-radius: 8px; max-width: 800px; }
            echo a { text-decoration: none; }
            echo .map-button { display: inline-block; margin-top: 10px; padding: 12px 18px; background: #333; color: white; border-radius: 6px; }
            echo ^</style^>
            echo ^</head^>
            echo ^<body^>
            echo ^<h1^>El Salvador Drought Monitoring^</h1^>
            echo ^<div class="box"^>
            echo ^<p^>Automated drought-monitoring products derived from Sentinel-2 L2A.^</p^>
            echo ^<p^>Latest products are automatically updated by the local processing system.^</p^>
            echo ^<h2^>Interactive Map^</h2^>
            echo ^<p^>Explore the latest drought-monitoring products interactively.^</p^>
            echo ^<a class="map-button" href="vectors/"^>Open Interactive Map^</a^>
            echo ^</div^>
            echo ^</body^>
            echo ^</html^>
          ) > "docs\index.html"

          echo.
          echo GitHub Pages index created.


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push web products
        shell: cmd
        run: |

          echo ==============================================
          echo COMMITTING WEB PRODUCTS
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Git repository:

          git rev-parse --show-toplevel

          echo.
          echo Git status:

          git status

          echo.
          echo Adding docs...

          git add docs

          echo.
          echo Checking staged changes...

          git diff --cached --quiet

          if not errorlevel 1 (

              echo.
              echo No changes detected.
              echo Nothing to commit.
              exit /b 0

          )

          echo.
          echo Creating commit...

          git commit -m "Update interactive drought monitoring map"

          if errorlevel 1 (

              echo.
              echo ERROR: Git commit failed.
              exit /b 1

          )

          echo.
          echo Pushing to GitHub...

          git push origin main

          if errorlevel 1 (

              echo.
              echo ERROR: Git push failed.
              exit /b 1

          )

          echo.
          echo ==============================================
          echo WEB PRODUCTS PUBLISHED SUCCESSFULLY
          echo ==============================================

          echo.
          echo GitHub Pages:
          echo https://rodrigomundo12.github.io/Sequias/

