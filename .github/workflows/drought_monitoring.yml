name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:

  test-python:

    runs-on: self-hosted

    steps:

      - name: Test Python environments
        shell: cmd
        run: |

          echo ==============================================
          echo TESTING PYTHON ENVIRONMENTS
          echo ==============================================

          echo.
          echo --- Default Python ---
          python --version

          echo.
          echo --- ArcGIS Pro Python ---
          "C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe" --version

          echo.
          echo --- Testing packages ---
          "C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe" -c "import sys; print(sys.executable); import numpy; print('numpy OK:', numpy.__version__); import pandas; print('pandas OK:', pandas.__version__); import rasterio; print('rasterio OK:', rasterio.__version__); import geopandas; print('geopandas OK:', geopandas.__version__); import shapely; print('shapely OK:', shapely.__version__); import fiona; print('fiona OK:', fiona.__version__); import requests; print('requests OK')"

          echo.
          echo ==============================================
          echo PYTHON TEST COMPLETE
          echo ==============================================