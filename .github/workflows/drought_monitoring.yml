name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:

  test-python:

    runs-on: self-hosted

    steps:

      - name: Test Sequias Python environment
        shell: cmd
        run: |

          echo ==============================================
          echo SEQUIAS PYTHON ENVIRONMENT
          echo ==============================================

          set PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe

          echo.
          echo Python:
          "%PYTHON_EXE%" --version

          echo.
          echo Executable:
          "%PYTHON_EXE%" -c "import sys; print(sys.executable)"

          echo.
          echo Testing NumPy:
          "%PYTHON_EXE%" -c "import numpy; print('numpy', numpy.__version__)"

          echo.
          echo Testing Pandas:
          "%PYTHON_EXE%" -c "import pandas; print('pandas', pandas.__version__)"

          echo.
          echo Testing Rasterio:
          "%PYTHON_EXE%" -c "import rasterio; print('rasterio', rasterio.__version__)"

          echo.
          echo Testing GeoPandas:
          "%PYTHON_EXE%" -c "import geopandas; print('geopandas', geopandas.__version__)"

          echo.
          echo Testing Shapely:
          "%PYTHON_EXE%" -c "import shapely; print('shapely', shapely.__version__)"

          echo.
          echo Testing Fiona:
          "%PYTHON_EXE%" -c "import fiona; print('fiona', fiona.__version__)"

          echo.
          echo Testing Sentinel Hub:
          "%PYTHON_EXE%" -c "import sentinelhub; print('sentinelhub OK')"

          echo.
          echo ==============================================
          echo ENVIRONMENT TEST COMPLETE
          echo ==============================================