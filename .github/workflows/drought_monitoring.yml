name: Drought Monitoring - Local Windows

on:
  workflow_dispatch:

jobs:
  drought-monitoring:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 0. SYNCHRONIZE LOCAL SELF-HOSTED RUNNER
      # ============================================================

      - name: Synchronize local repository
        shell: cmd
        run: |
          echo ==============================================
          echo SYNCHRONIZING LOCAL REPOSITORY
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Fetching origin/main...

          git fetch origin main

          if errorlevel 1 (
              echo ERROR: git fetch failed.
              exit /b 1
          )

          echo.
          echo Resetting local repository to origin/main...

          git reset --hard origin/main

          if errorlevel 1 (
              echo ERROR: git reset failed.
              exit /b 1
          )

          echo.
          echo Current commit:

          git rev-parse --short HEAD

          echo.
          echo Repository synchronized successfully.


      # ============================================================
      # 1. RUN DROUGHT MONITORING
      # ============================================================

      - name: Run Sequias drought monitoring
        shell: cmd
        run: |
          echo ==============================================
          echo STARTING SEQUIAS DROUGHT MONITORING
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"
          set "PYTHON_EXE=C:\Program Files\ArcGIS\Pro\bin\Python\envs\arcgispro-py3\python.exe"
          set "SCRIPT=%PROJECT_ROOT%\scripts\run_drought_monitoring.py"

          echo.
          echo Project directory:
          echo %PROJECT_ROOT%

          echo.
          echo Python executable:
          echo %PYTHON_EXE%

          echo.
          echo Script:
          echo %SCRIPT%

          if not exist "%PYTHON_EXE%" (
              echo ERROR: Python executable not found.
              exit /b 1
          )

          if not exist "%SCRIPT%" (
              echo ERROR: Drought monitoring script not found.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo RUNNING DROUGHT MONITORING SCRIPT
          echo ==============================================

          cd /d "%PROJECT_ROOT%"

          "%PYTHON_EXE%" "%SCRIPT%"

          if errorlevel 1 (
              echo.
              echo ==============================================
              echo DROUGHT MONITORING FAILED
              echo ==============================================
              exit /b 1
          )

          echo.
          echo ==============================================
          echo DROUGHT MONITORING COMPLETED SUCCESSFULLY
          echo ==============================================


      # ============================================================
      # 2. PREPARE GITHUB PAGES
      # ============================================================

      - name: Prepare GitHub Pages
        shell: powershell -ExecutionPolicy Bypass
        run: |
          Write-Host "=============================================="
          Write-Host "PREPARING GITHUB PAGES"
          Write-Host "=============================================="

          $PROJECT_ROOT = "C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          Set-Location $PROJECT_ROOT

          Write-Host ""
          Write-Host "Project directory:"
          Write-Host $PROJECT_ROOT

          Write-Host ""
          Write-Host "Cleaning previous web vectors..."

          if (Test-Path "docs\vectors") {
              Remove-Item "docs\vectors" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "docs\vectors" -Force | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "COPYING LATEST GEOJSON FILES"
          Write-Host "=============================================="

          $products = @(
              "NDDI",
              "MNDWI",
              "NMDI",
              "NDII",
              "NDVI"
          )

          foreach ($product in $products) {

              $source = "distribution\latest\vectors\$product.geojson"
              $destination = "docs\vectors\$product.geojson"

              Write-Host "Checking: $source"

              if (-not (Test-Path $source)) {
                  Write-Error "Missing GeoJSON: $source"
                  exit 1
              }

              Copy-Item $source $destination -Force

              Write-Host "Copied: $product.geojson"
          }

          Write-Host ""
          Write-Host "GeoJSON files copied successfully."

          # ========================================================
          # CREATE INTERACTIVE LEAFLET MAP
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CREATING INTERACTIVE LEAFLET MAP"
          Write-Host "=============================================="

          $html = @'
          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>El Salvador Drought Monitoring Map</title>

          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

          <style>

          html,
          body {
              height: 100%;
              margin: 0;
              padding: 0;
              font-family: Arial, sans-serif;
          }

          #map {
              width: 100%;
              height: 100vh;
          }

          .title-box,
          .legend,
          .info-box {
              background: white;
              padding: 10px 14px;
              border-radius: 6px;
              box-shadow: 0 1px 5px rgba(0,0,0,0.3);
          }

          .title-box h1 {
              margin: 0;
              font-size: 18px;
          }

          .title-box p {
              margin: 5px 0 0;
              font-size: 12px;
          }

          .legend {
              line-height: 20px;
          }

          .legend h4 {
              margin: 0 0 6px;
          }

          .legend-item {
              display: flex;
              align-items: center;
          }

          .legend-color {
              width: 18px;
              height: 18px;
              margin-right: 7px;
              border: 1px solid #777;
          }

          .info-box {
              min-width: 170px;
          }

          .leaflet-control-layers {
              font-size: 14px;
          }

          .leaflet-control-layers-expanded {
              padding: 8px 12px;
          }

          </style>

          </head>

          <body>

          <div id="map"></div>

          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

          <script>

          console.log("EL SALVADOR DROUGHT MONITORING MAP");


          const map = L.map("map", {
              center: [13.7942, -88.8965],
              zoom: 8
          });


          const osm = L.tileLayer(
              "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
              {
                  maxZoom: 19,
                  attribution: "&copy; OpenStreetMap contributors"
              }
          ).addTo(map);


          const classColors = {
              1: "#8B0000",
              2: "#FF8C00",
              3: "#FFFF66",
              4: "#90EE90",
              5: "#006400"
          };


          const classNames = {
              1: "Very Low",
              2: "Low",
              3: "Normal",
              4: "High",
              5: "Very High"
          };


          const overlayLayers = {};


          const files = [
              "NDDI",
              "MNDWI",
              "NMDI",
              "NDII",
              "NDVI"
          ];


          function styleFeature(feature) {

              const id = feature.properties?.class_id;

              return {
                  color: "#444",
                  weight: 0.4,
                  opacity: 0.8,
                  fillColor: classColors[id] || "#999",
                  fillOpacity: 0.65
              };
          }


          function onEachFeature(feature, layer) {

              const p = feature.properties || {};

              const cls =
                  p.class_name ||
                  classNames[p.class_id] ||
                  "Unknown";

              const area =
                  p.area_m2 != null
                      ? Number(p.area_m2).toLocaleString(
                            undefined,
                            {
                                maximumFractionDigits: 0
                            }
                        ) + " m²"
                      : "N/A";

              const min =
                  p.min_value != null
                      ? Number(p.min_value).toFixed(4)
                      : "N/A";

              const max =
                  p.max_value != null
                      ? Number(p.max_value).toFixed(4)
                      : "N/A";

              layer.bindPopup(
                  "<strong>El Salvador Drought Monitoring</strong>" +
                  "<br><br>" +
                  "<b>Index:</b> " +
                  (p.index || "N/A") +
                  "<br>" +
                  "<b>Class:</b> " +
                  cls +
                  "<br>" +
                  "<b>Area:</b> " +
                  area +
                  "<br>" +
                  "<b>Minimum:</b> " +
                  min +
                  "<br>" +
                  "<b>Maximum:</b> " +
                  max
              );
          }


          async function loadAllLayers() {

              const status =
                  document.getElementById("status");

              status.textContent =
                  "Loading drought products...";

              console.log(
                  "Loading five GeoJSON products..."
              );

              try {

                  const promises = files.map(
                      async function(name) {

                          console.log(
                              "Requesting " +
                              name +
                              ".geojson"
                          );

                          const response =
                              await fetch(
                                  name + ".geojson"
                              );

                          if (!response.ok) {

                              throw new Error(
                                  name +
                                  ".geojson HTTP " +
                                  response.status
                              );
                          }

                          const data =
                              await response.json();

                          console.log(
                              name +
                              ".geojson loaded."
                          );

                          const layer =
                              L.geoJSON(
                                  data,
                                  {
                                      style: styleFeature,
                                      onEachFeature: onEachFeature
                                  }
                              );

                          overlayLayers[name] =
                              layer;

                          return layer;
                      }
                  );


                  await Promise.all(promises);


                  console.log(
                      "ALL FIVE LAYERS LOADED."
                  );


                  const layerControl =
                      L.control.layers(
                          {
                              "OpenStreetMap": osm
                          },
                          null,
                          {
                              collapsed: false,
                              position: "topright"
                          }
                      ).addTo(map);


                  layerControl.addOverlay(
                      overlayLayers["NDDI"],
                      "NDDI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["MNDWI"],
                      "MNDWI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NMDI"],
                      "NMDI"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NDII"],
                      "NDII"
                  );

                  layerControl.addOverlay(
                      overlayLayers["NDVI"],
                      "NDVI"
                  );


                  overlayLayers["NDDI"].addTo(map);


                  const bounds =
                      overlayLayers["NDDI"].getBounds();


                  if (bounds.isValid()) {

                      map.fitBounds(
                          bounds,
                          {
                              padding: [20, 20]
                          }
                      );
                  }


                  status.textContent =
                      "5 / 5 drought products loaded";


                  console.log(
                      "LAYER CONTROL READY"
                  );

              }

              catch (error) {

                  console.error(
                      "ERROR LOADING DROUGHT PRODUCTS:",
                      error
                  );

                  status.textContent =
                      "ERROR: " +
                      error.message;
              }
          }


          const title =
              L.control({
                  position: "topleft"
              });


          title.onAdd =
              function() {

                  const d =
                      L.DomUtil.create(
                          "div",
                          "title-box"
                      );

                  d.innerHTML =
                      "<h1>El Salvador Drought Monitoring</h1>" +
                      "<p>Sentinel-2 L2A drought indices</p>";

                  return d;
              };


          title.addTo(map);


          const legend =
              L.control({
                  position: "bottomright"
              });


          legend.onAdd =
              function() {

                  const d =
                      L.DomUtil.create(
                          "div",
                          "legend"
                      );

                  d.innerHTML =
                      "<h4>Drought Classification</h4>";

                  for (
                      let i = 1;
                      i <= 5;
                      i++
                  ) {

                      d.innerHTML +=
                          "<div class='legend-item'>" +
                          "<div class='legend-color' " +
                          "style='background:" +
                          classColors[i] +
                          "'></div>" +
                          classNames[i] +
                          "</div>";
                  }

                  return d;
              };


          legend.addTo(map);


          const info =
              L.control({
                  position: "bottomleft"
              });


          info.onAdd =
              function() {

                  const d =
                      L.DomUtil.create(
                          "div",
                          "info-box"
                      );

                  d.id = "status";

                  d.textContent =
                      "Loading drought products...";

                  return d;
              };


          info.addTo(map);


          loadAllLayers();

          </script>

          </body>

          </html>
          '@


          # ========================================================
          # WRITE HTML FILE
          # ========================================================

          $htmlPath = "docs\vectors\index.html"

          Set-Content -Path $htmlPath -Value $html -Encoding UTF8

          if (-not (Test-Path $htmlPath)) {
              Write-Host "ERROR: Could not create interactive map."
              exit 1
          }

          Write-Host ""
          Write-Host "Interactive Leaflet map created successfully."


          # ========================================================
          # VERIFY WEB FILES
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "VERIFYING WEB FILES"
          Write-Host "=============================================="

          Get-ChildItem "docs\vectors"

          $mapText = Get-Content "docs\vectors\index.html" -Raw

          Write-Host ""
          Write-Host "Map HTML size:"
          Write-Host (Get-Item "docs\vectors\index.html").Length

          Write-Host ""
          Write-Host "Leaflet detected:"
          Write-Host $mapText.Contains("leaflet@1.9.4")

          Write-Host "NDDI detected:"
          Write-Host $mapText.Contains("NDDI")

          Write-Host "MNDWI detected:"
          Write-Host $mapText.Contains("MNDWI")

          Write-Host "NMDI detected:"
          Write-Host $mapText.Contains("NMDI")

          Write-Host "NDII detected:"
          Write-Host $mapText.Contains("NDII")

          Write-Host "NDVI detected:"
          Write-Host $mapText.Contains("NDVI")

          Write-Host "Promise.all detected:"
          Write-Host $mapText.Contains("Promise.all")

          Write-Host "addOverlay detected:"
          Write-Host $mapText.Contains("addOverlay")

          Write-Host "Layer control detected:"
          Write-Host $mapText.Contains("L.control.layers")


          # ========================================================
          # COPY METADATA
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "COPYING METADATA"
          Write-Host "=============================================="

          if (Test-Path "docs\metadata") {
              Remove-Item "docs\metadata" -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Path "docs\metadata" `
              -Force |
              Out-Null

          if (Test-Path "metadata") {

              Copy-Item `
                  "metadata\*" `
                  "docs\metadata\" `
                  -Recurse `
                  -Force

          }
          else {

              Write-Host "WARNING: No metadata directory found."

          }


          Write-Host ""
          Write-Host "=============================================="
          Write-Host "GITHUB PAGES FILES PREPARED"
          Write-Host "=============================================="


      # ============================================================
      # 3. CREATE GITHUB PAGES LANDING PAGE
      # ============================================================

      - name: Create GitHub Pages index
        shell: powershell -ExecutionPolicy Bypass
        run: |

          Write-Host "=============================================="
          Write-Host "CREATING GITHUB PAGES INDEX"
          Write-Host "=============================================="

          $PROJECT_ROOT = "C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          Set-Location $PROJECT_ROOT


          $html = @'
          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport" content="width=device-width, initial-scale=1.0">

          <title>El Salvador Drought Monitoring</title>

          <style>

          body {
              font-family: Arial, sans-serif;
              margin: 40px;
          }

          h1 {
              margin-bottom: 10px;
          }

          .box {
              padding: 20px;
              border: 1px solid #ccc;
              border-radius: 8px;
              max-width: 800px;
          }

          a {
              text-decoration: none;
          }

          .map-button {
              display: inline-block;
              margin-top: 10px;
              padding: 12px 18px;
              background: #333;
              color: white;
              border-radius: 6px;
          }

          </style>

          </head>

          <body>

          <h1>El Salvador Drought Monitoring</h1>

          <div class="box">

          <p>
          Automated drought-monitoring products derived from Sentinel-2 L2A.
          </p>

          <p>
          Latest products are automatically updated by the local processing system.
          </p>

          <h2>Interactive Map</h2>

          <p>
          Explore the latest drought-monitoring products interactively.
          </p>

          <a class="map-button" href="vectors/">
          Open Interactive Map
          </a>

          </div>

          </body>

          </html>
          '@


          $htmlPath = "docs\index.html"

          Set-Content `
              -Path $htmlPath `
              -Value $html `
              -Encoding UTF8

          if (-not (Test-Path $htmlPath)) {
              Write-Host "ERROR: Could not create GitHub Pages landing page."
              exit 1
          }

          Write-Host ""
          Write-Host "GitHub Pages landing page created successfully."


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push web products
        shell: cmd
        run: |

          echo ==============================================
          echo COMMITTING WEB PRODUCTS
          echo ==============================================

          set "PROJECT_ROOT=C:\Users\LLRL-PAHs2\Downloads\sequias-poligonos"

          cd /d "%PROJECT_ROOT%"

          echo.
          echo Git repository:

          git rev-parse --show-toplevel

          echo.
          echo Git status:

          git status

          echo.
          echo Adding docs...

          git add docs

          echo.
          echo Checking staged changes...

          git diff --cached --quiet

          if not errorlevel 1 (
              echo.
              echo No changes detected.
              echo Nothing to commit.
              exit /b 0
          )

          echo.
          echo Creating commit...

          git commit -m "Add interactive drought monitoring map"

          if errorlevel 1 (
              echo.
              echo ERROR: Git commit failed.
              exit /b 1
          )

          echo.
          echo Pushing to GitHub...

          git push origin main

          if errorlevel 1 (
              echo.
              echo ERROR: Git push failed.
              exit /b 1
          )

          echo.
          echo ==============================================
          echo WEB PRODUCTS PUBLISHED SUCCESSFULLY
          echo ==============================================

          echo.
          echo GitHub Pages:

          echo https://rodrigomundo12.github.io/Sequias/

