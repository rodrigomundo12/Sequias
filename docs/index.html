<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>El Salvador Drought Monitoring</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f5f5;
}

h1 {
    margin-bottom: 10px;
}

.box {
    padding: 25px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    max-width: 800px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

a {
    text-decoration: none;
}

.map-button {
    display: inline-block;
    margin-top: 10px;
    padding: 12px 18px;
    background: #333;
    color: white;
    border-radius: 6px;
}

.map-button:hover {
    background: #555;
}

</style>

</head>

<body>

<h1>El Salvador Drought Monitoring</h1>

<div class="box">

<p>
Automated drought-monitoring products derived from
Sentinel-2 L2A.
</p>

<p>
Latest products are automatically updated by the local
processing system.
</p>

<h2>Interactive Map</h2>

<p>
Explore the latest drought-monitoring products interactively.
</p>

<a
    class="map-button"
    href="vectors/"
>
Open Interactive Map
</a>

</div>

</body>

</html>
