<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>El Salvador Drought Monitoring</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* -------------------------------------------------------
           INDEX CONTROL
           ------------------------------------------------------- */

        .index-control {
            background: white;
            padding: 10px 12px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font-family: Arial, sans-serif;
            line-height: 1.8;
        }

        .index-control-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .index-option {
            display: block;
            white-space: nowrap;
            cursor: pointer;
        }

        .index-option input {
            margin-right: 6px;
            cursor: pointer;
        }

        /* -------------------------------------------------------
           LEGEND
           ------------------------------------------------------- */

        .legend {
            background: white;
            padding: 10px 12px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font-family: Arial, sans-serif;
            line-height: 18px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 7px;
            border: 1px solid #555;
        }

    </style>

</head>


<body>

<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const indices = [
        "NDDI",
        "MNDWI",
        "NMDI",
        "NDII",
        "NDVI"
    ];


    // ============================================================
    // MAP
    // ============================================================

    const map = L.map("map").setView(
        [13.7942, -88.8965],
        8
    );


    // ============================================================
    // BASE MAP
    // ============================================================

    const osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }
    ).addTo(map);


    // ============================================================
    // CLASSIFICATION
    // ============================================================

    const classColors = {

        1: "#8B0000",
        2: "#FF8C00",
        3: "#FFFF66",
        4: "#90EE90",
        5: "#006400"

    };


    const classNames = {

        1: "Very Low",
        2: "Low",
        3: "Normal",
        4: "High",
        5: "Very High"

    };


    // ============================================================
    // STORAGE FOR GEOJSON LAYERS
    // ============================================================

    const overlayLayers = {};


    // ============================================================
    // STYLE GEOJSON
    //
    // IMPORTANT:
    // The GeoJSON properties are:
    //
    //     class
    //     label
    //
    // NOT:
    //
    //     class_id
    //     class_name
    // ============================================================

    function styleFeature(feature) {

    const properties = feature.properties || {};

    // Support both GeoJSON schemas:
    //
    // NDDI:
    //   class_id
    //
    // Other indices:
    //   class
    //
    const classValue = Number(
        properties.class ?? properties.class_id
    );

    return {

            color: "#444",

            weight: 0.4,

            opacity: 0.8,

            fillColor:
                classColors[classValue] || "#999",

            fillOpacity: 0.65

        };

    }


    // ============================================================
    // POPUP
    // ============================================================

    function onEachFeature(feature, layer) {

    const properties =
        feature.properties || {};


    // Support both GeoJSON schemas:
    //
    // NDDI:
    //   class_id
    //   class_name
    //
    // Other indices:
    //   class
    //   label
    //
    const classValue = Number(
        properties.class ??
        properties.class_id
    );


    const label =
        properties.label ??
        properties.class_name ??
        classNames[classValue] ??
        "Unknown";


        const popupHTML =

            "<div style='font-family: Arial, sans-serif;'>" +

            "<b>Index:</b> " +
            currentIndex +

            "<br>" +

            "<b>Class:</b> " +
            label +

            "<br>" +

            "<b>Class value:</b> " +
            (
                Number.isFinite(classValue)
                    ? classValue
                    : "N/A"
            ) +

            "</div>";


        layer.bindPopup(
            popupHTML
        );

    }


    // ============================================================
    // CURRENTLY SELECTED INDEX
    // ============================================================

    let currentIndex = "NDDI";


    // ============================================================
    // LOAD ALL GEOJSON FILES
    // ============================================================

    async function loadAllLayers() {

        const promises = indices.map(
            async function(index) {

                const response = await fetch(
                    index + ".geojson"
                );


                if (!response.ok) {

                    throw new Error(
                        "Could not load " +
                        index +
                        ".geojson"
                    );

                }


                const data =
                    await response.json();


                const layer = L.geoJSON(
                    data,
                    {
                        style: styleFeature,
                        onEachFeature: onEachFeature
                    }
                );


                overlayLayers[index] =
                    layer;


                return index;

            }
        );


        await Promise.all(
            promises
        );


        // ========================================================
        // SHOW NDDI INITIALLY
        // ========================================================

        overlayLayers["NDDI"].addTo(map);


        currentIndex = "NDDI";


        // ========================================================
        // CREATE SINGLE-SELECTION CONTROL
        // ========================================================

        createIndexControl();

    }


    // ============================================================
    // CREATE INDEX CONTROL
    //
    // The controls look like checkboxes.
    //
    // However, JavaScript forces them to behave as a
    // SINGLE-SELECTION control.
    //
    // Therefore:
    //
    // NDDI     [x]
    // MNDWI    [ ]
    // NMDI     [ ]
    // NDII     [ ]
    // NDVI     [ ]
    //
    // Selecting another index automatically hides the
    // previously selected one.
    // ============================================================

    function createIndexControl() {

        const control =
            L.control({
                position: "topright"
            });


        control.onAdd = function() {

            const container =
                L.DomUtil.create(
                    "div",
                    "index-control"
                );


            L.DomEvent.disableClickPropagation(
                container
            );


            const title =
                L.DomUtil.create(
                    "div",
                    "index-control-title",
                    container
                );


            title.innerHTML =
                "Drought Index";


            indices.forEach(
                function(index) {

                    const label =
                        L.DomUtil.create(
                            "label",
                            "index-option",
                            container
                        );


                    const checkbox =
                        L.DomUtil.create(
                            "input",
                            "",
                            label
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.value =
                        index;


                    checkbox.checked =
                        (
                            index ===
                            currentIndex
                        );


                    const text =
                        document.createTextNode(
                            index
                        );


                    label.appendChild(
                        text
                    );


                    // ------------------------------------------------
                    // SINGLE-SELECTION BEHAVIOR
                    // ------------------------------------------------

                    checkbox.addEventListener(
                        "change",
                        function() {

                            // If user tries to uncheck the
                            // currently active index, immediately
                            // turn it back on.
                            if (!checkbox.checked) {

                                checkbox.checked = true;

                                return;

                            }


                            // Hide every other index.
                            indices.forEach(
                                function(otherIndex) {

                                    if (otherIndex !== index) {

                                        const otherLayer =
                                            overlayLayers[otherIndex];


                                        if (
                                            otherLayer &&
                                            map.hasLayer(otherLayer)
                                        ) {

                                            map.removeLayer(
                                                otherLayer
                                            );

                                        }

                                    }

                                }
                            );


                            // Show selected index.
                            const selectedLayer =
                                overlayLayers[index];


                            if (
                                selectedLayer &&
                                !map.hasLayer(selectedLayer)
                            ) {

                                selectedLayer.addTo(map);

                            }


                            // Update current index.
                            currentIndex =
                                index;


                            // Update all checkbox states.
                            const allCheckboxes =
                                container.querySelectorAll(
                                    "input[type='checkbox']"
                                );


                            allCheckboxes.forEach(
                                function(otherCheckbox) {

                                    otherCheckbox.checked =
                                        (
                                            otherCheckbox.value ===
                                            currentIndex
                                        );

                                }
                            );

                        }
                    );

                }
            );


            return container;

        };


        control.addTo(
            map
        );

    }


    // ============================================================
    // LEGEND
    // ============================================================

    const legend =
        L.control({
            position: "bottomright"
        });


    legend.onAdd = function() {

        const div =
            L.DomUtil.create(
                "div",
                "legend"
            );


        div.innerHTML =
            "<div class='legend-title'>" +
            "Classification" +
            "</div>";


        const classes = [
            [1, "Very Low"],
            [2, "Low"],
            [3, "Normal"],
            [4, "High"],
            [5, "Very High"]
        ];


        classes.forEach(
            function(item) {

                const classValue =
                    item[0];

                const classLabel =
                    item[1];


                div.innerHTML +=

                    "<div class='legend-item'>" +

                    "<span class='legend-color' " +
                    "style='background:" +
                    classColors[classValue] +
                    ";'></span>" +

                    classLabel +

                    "</div>";

            }
        );


        return div;

    };


    legend.addTo(
        map
    );


    // ============================================================
    // LOAD DATA
    // ============================================================

    loadAllLayers()
        .catch(
            function(error) {

                console.error(
                    "Error loading drought layers:",
                    error
                );


                alert(
                    "Error loading drought data. " +
                    "Please check the browser console."
                );

            }
        );

</script>

</body>
</html>
