<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Salvador Drought Monitoring Map</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

.title-box,
.legend,
.info-box {
    background: white;
    padding: 10px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

.title-box h1 {
    margin: 0;
    font-size: 18px;
}

.title-box p {
    margin: 5px 0 0;
    font-size: 12px;
}

.legend {
    line-height: 20px;
}

.legend h4 {
    margin: 0 0 6px;
}

.legend-item {
    display: flex;
    align-items: center;
}

.legend-color {
    width: 18px;
    height: 18px;
    margin-right: 7px;
    border: 1px solid #777;
}

.info-box {
    min-width: 190px;
}

.leaflet-control-layers {
    font-size: 14px;
}

.leaflet-control-layers-expanded {
    padding: 8px 12px;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

console.log("EL SALVADOR DROUGHT MONITORING MAP");


/* ============================================================
   MAP
   ============================================================ */

const map = L.map("map", {
    center: [13.7942, -88.8965],
    zoom: 8
});


/* ============================================================
   BASE MAP
   ============================================================ */

const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* ============================================================
   CLASSIFICATION COLORS
   ============================================================ */

const classColors = {
    1: "#8B0000",
    2: "#FF8C00",
    3: "#FFFF66",
    4: "#90EE90",
    5: "#006400"
};


const classNames = {
    1: "Very Low",
    2: "Low",
    3: "Normal",
    4: "High",
    5: "Very High"
};


/* ============================================================
   DROUGHT PRODUCTS
   ============================================================ */

const overlayLayers = {};

const files = [
    "NDDI",
    "MNDWI",
    "NMDI",
    "NDII",
    "NDVI"
];


/* ============================================================
   STYLE
   ============================================================ */

function styleFeature(feature) {

    const id = feature.properties?.class_id;

    return {
        color: "#444",
        weight: 0.4,
        opacity: 0.8,
        fillColor: classColors[id] || "#999",
        fillOpacity: 0.65
    };
}


/* ============================================================
   POPUP
   ============================================================ */

function onEachFeature(feature, layer) {

    const p = feature.properties || {};

    const cls =
        p.class_name ||
        classNames[p.class_id] ||
        "Unknown";

    const area =
        p.area_m2 != null
            ? Number(p.area_m2).toLocaleString(
                  undefined,
                  {
                      maximumFractionDigits: 0
                  }
              ) + " m²"
            : "N/A";

    const min =
        p.min_value != null
            ? Number(p.min_value).toFixed(4)
            : "N/A";

    const max =
        p.max_value != null
            ? Number(p.max_value).toFixed(4)
            : "N/A";

    layer.bindPopup(
        "<strong>El Salvador Drought Monitoring</strong>" +
        "<br><br>" +
        "<b>Index:</b> " +
        (p.index || "N/A") +
        "<br>" +
        "<b>Class:</b> " +
        cls +
        "<br>" +
        "<b>Area:</b> " +
        area +
        "<br>" +
        "<b>Minimum:</b> " +
        min +
        "<br>" +
        "<b>Maximum:</b> " +
        max
    );
}


/* ============================================================
   LOAD ALL FIVE GEOJSON PRODUCTS
   ============================================================ */

async function loadAllLayers() {

    const status =
        document.getElementById("status");

    status.textContent =
        "Loading drought products...";

    console.log(
        "Loading five GeoJSON products..."
    );

    try {

        const promises = files.map(
            async function(name) {

                console.log(
                    "Requesting " +
                    name +
                    ".geojson"
                );

                const response =
                    await fetch(
                        name + ".geojson"
                    );

                if (!response.ok) {

                    throw new Error(
                        name +
                        ".geojson HTTP " +
                        response.status
                    );
                }

                const data =
                    await response.json();

                console.log(
                    name +
                    ".geojson loaded."
                );

                const layer =
                    L.geoJSON(
                        data,
                        {
                            style: styleFeature,
                            onEachFeature: onEachFeature
                        }
                    );

                overlayLayers[name] =
                    layer;

                return layer;
            }
        );


        /* --------------------------------------------------------
           IMPORTANT:
           Wait until ALL FIVE layers exist before creating
           the Leaflet layer control.
           -------------------------------------------------------- */

        await Promise.all(promises);


        console.log(
            "ALL FIVE LAYERS LOADED."
        );


        /* ========================================================
           LAYER CONTROL
           ======================================================== */

        const layerControl =
            L.control.layers(
                {
                    "OpenStreetMap": osm
                },
                null,
                {
                    collapsed: false,
                    position: "topright"
                }
            ).addTo(map);


        /*
         * Add the five drought indices to the control.
         */

        layerControl.addOverlay(
            overlayLayers["NDDI"],
            "NDDI"
        );

        layerControl.addOverlay(
            overlayLayers["MNDWI"],
            "MNDWI"
        );

        layerControl.addOverlay(
            overlayLayers["NMDI"],
            "NMDI"
        );

        layerControl.addOverlay(
            overlayLayers["NDII"],
            "NDII"
        );

        layerControl.addOverlay(
            overlayLayers["NDVI"],
            "NDVI"
        );


        /* ========================================================
           INITIAL LAYER
           ======================================================== */

        overlayLayers["NDDI"].addTo(map);


        /* ========================================================
           ZOOM TO EL SALVADOR PRODUCT
           ======================================================== */

        const bounds =
            overlayLayers["NDDI"].getBounds();

        if (bounds.isValid()) {

            map.fitBounds(
                bounds,
                {
                    padding: [20, 20]
                }
            );
        }


        status.textContent =
            "5 / 5 drought products loaded";


        console.log(
            "LAYER CONTROL READY"
        );

    }

    catch (error) {

        console.error(
            "ERROR LOADING DROUGHT PRODUCTS:",
            error
        );

        status.textContent =
            "ERROR: " +
            error.message;
    }
}


/* ============================================================
   TITLE
   ============================================================ */

const title =
    L.control({
        position: "topleft"
    });


title.onAdd =
    function() {

        const d =
            L.DomUtil.create(
                "div",
                "title-box"
            );

        d.innerHTML =
            "<h1>El Salvador Drought Monitoring</h1>" +
            "<p>Sentinel-2 L2A drought indices</p>";

        return d;
    };


title.addTo(map);


/* ============================================================
   LEGEND
   ============================================================ */

const legend =
    L.control({
        position: "bottomright"
    });


legend.onAdd =
    function() {

        const d =
            L.DomUtil.create(
                "div",
                "legend"
            );

        d.innerHTML =
            "<h4>Drought Classification</h4>";

        for (
            let i = 1;
            i <= 5;
            i++
        ) {

            d.innerHTML +=
                "<div class='legend-item'>" +
                "<div class='legend-color' " +
                "style='background:" +
                classColors[i] +
                "'></div>" +
                classNames[i] +
                "</div>";
        }

        return d;
    };


legend.addTo(map);


/* ============================================================
   STATUS BOX
   ============================================================ */

const info =
    L.control({
        position: "bottomleft"
    });


info.onAdd =
    function() {

        const d =
            L.DomUtil.create(
                "div",
                "info-box"
            );

        d.id = "status";

        d.textContent =
            "Loading drought products...";

        return d;
    };


info.addTo(map);


/* ============================================================
   START
   ============================================================ */

loadAllLayers();

</script>

</body>

</html>
